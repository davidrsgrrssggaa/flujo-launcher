name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar APK de depuración
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |What went wrong|Execution failed|Could not|error:" -A2 build.log | head -90 | cut -c1-300 | sed 's/%/%25/g' | sed 's/$/%0A/' | tr -d '\n')
            echo "::error title=Fallo de Gradle::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: flujo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
